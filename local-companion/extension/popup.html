<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saathi Browser Helper</title><style>body{width:365px;margin:0;padding:20px;background:linear-gradient(125deg,#eef8f7,#fff9ec);color:#21475d;font:14px/1.6 Segoe UI,Arial,sans-serif}h1{font-size:23px;margin:3px 0}button{padding:10px 13px;margin:5px 4px 5px 0;border:0;border-radius:10px;background:#287b87;color:#fff;cursor:pointer}button.secondary{background:#dcefee;color:#235968}label{display:block;margin:12px 0}input{padding:10px;border-radius:9px;border:1px solid #accdcf;width:100%;box-sizing:border-box}pre{max-height:185px;white-space:pre-wrap;overflow:auto;background:#fff;border:1px solid #cfdfdf;border-radius:11px;padding:12px}small{color:#58727c}</style></head><body><small>YOUR CURRENT TAB · CLICK-TO-RUN ONLY</small><h1>Saathi Browser Helper</h1><p>Read your current page for studying, highlight a topic or open a matching educational link. Nothing is sent to Saathi or any external service automatically.</p><button id="read">Read current page</button><button id="copy" class="secondary">Copy excerpt</button><label>Find a topic or link<input id="topic" maxlength="80" placeholder="aircraft lift"></label><button id="highlight">Highlight on page</button><button id="open" class="secondary">Open matching link</button><pre id="result" role="status">Choose an action to begin.</pre><script type="module" src="popup.js"></script></body></html>
